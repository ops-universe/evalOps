name: Core CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node src/cli.mjs validate datasets/synthetic.json
      - run: node src/cli.mjs run datasets/synthetic.json --min-pass-rate 0.75 --out evidence.json
      - name: Verify failed gate is blocking
        run: |
          code=0
          node src/cli.mjs run datasets/synthetic.json --min-pass-rate 1 --out failed-evidence.json || code=$?
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-evidence
          path: |
            evidence.json
            failed-evidence.json
          if-no-files-found: error
  website-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website-react
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: |
          npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify root and project base builds
        run: |
          test -f dist/index.html
          VITE_BASE_PATH=/evalOps/ npm run build
          grep -q '/evalOps/assets/' dist/index.html
